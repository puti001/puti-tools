<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puti-AI | 禪者心燈：現場思辨互動</title>
  <!-- Google Fonts 日系暖心圓體 Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-body: #FFFDF9; /* 暖米白 */
      --bg-card: #FFFFFF; /* 純白卡片 */
      --border-warm: #EFE8DE; /* 暖米色邊框 */
      --text-main: #332C2B; /* 深炭褐 */
      --text-muted: #7E7571; /* 柔灰褐 */
      
      /* 莫蘭迪暖調粉彩四原色 */
      --color-a: #E07A5F; /* 珊瑚陶土粉 */
      --color-b: #81B29A; /* 抹茶柔綠 */
      --color-c: #F2CC8F; /* 暖陽軟糖黃 */
      --color-d: #3D5A80; /* 謐藍深褐 */

      --accent-brown: #7C4D25;
      --accent-gold: #C49A45;
      --accent-soft: #F5EEE6;

      --shadow-sm: 0 4px 14px rgba(124, 77, 37, 0.05);
      --shadow-md: 0 10px 28px rgba(124, 77, 37, 0.09);
      --shadow-lg: 0 18px 45px rgba(124, 77, 37, 0.13);
      --radius-lg: 24px;
      --radius-pill: 40px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      letter-spacing: 0.03em;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.75;
    }

    /* 頂部列 */
    header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border-warm);
      padding: 14px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--accent-brown);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--accent-brown);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: var(--radius-pill);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border-warm);
      background: #fff;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-gold);
    }

    /* 題目切換索引列 */
    .progress-strip {
      display: flex;
      background: #ffffff;
      border-bottom: 1.5px solid var(--border-warm);
      overflow-x: auto;
      padding: 10px 24px;
      gap: 12px;
    }

    .q-tab {
      flex: 1;
      min-width: 145px;
      padding: 11px 14px;
      border-radius: 16px;
      background: var(--bg-body);
      border: 1.5px solid var(--border-warm);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .q-tab.active {
      background: var(--accent-soft);
      border-color: var(--accent-brown);
      color: var(--accent-brown);
      box-shadow: var(--shadow-sm);
    }

    /* 主舞台 */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 24px 60px;
      width: 100%;
    }

    .stage-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-warm);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 情境題目區 */
    .scenario-header {
      background: linear-gradient(135deg, #ffffff 0%, #faf6ef 100%);
      padding: 32px 40px;
      border-bottom: 2px solid var(--border-warm);
    }

    .scenario-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #211c19;
      margin-bottom: 16px;
      line-height: 1.35;
    }

    .scenario-desc {
      font-size: 1.35rem;
      color: #3d3632;
      line-height: 1.7;
      background: #ffffff;
      padding: 22px 28px;
      border-radius: 18px;
      border-left: 6px solid var(--accent-gold);
      box-shadow: inset 0 0 0 1px var(--border-warm);
    }

    /* 四宮格作答卡片區 (2x2) */
    .options-section {
      padding: 32px 40px;
    }

    .options-tip-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .options-tip {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-brown);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
    }

    .quad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 860px) {
      .quad-grid { grid-template-columns: 1fr; }
    }

    .quad-card {
      background: #ffffff;
      border: 2.5px solid var(--border-warm);
      border-radius: var(--radius-lg);
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 230px;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
    }

    .quad-card.card-A { border-top: 8px solid var(--color-a); }
    .quad-card.card-B { border-top: 8px solid var(--color-b); }
    .quad-card.card-C { border-top: 8px solid var(--color-c); }
    .quad-card.card-D { border-top: 8px solid var(--color-d); }

    .quad-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .card-letter {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      font-size: 1.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }

    .card-A .card-letter { background: var(--color-a); }
    .card-B .card-letter { background: var(--color-b); }
    .card-C .card-letter { background: var(--color-c); color: #332C2B; }
    .card-D .card-letter { background: var(--color-d); }

    .card-text {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.55;
    }

    /* 計票列 */
    .card-vote-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAF7F2;
      border: 1.5px solid var(--border-warm);
      padding: 10px 18px;
      border-radius: 14px;
    }

    .vote-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .v-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border-warm);
      background: #fff;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--text-main);
    }

    .v-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-brown);
    }

    .vote-track {
      flex: 1;
      height: 14px;
      background: #EBE4D8;
      border-radius: 7px;
      margin: 0 16px;
      overflow: hidden;
    }

    .vote-fill {
      height: 100%;
      width: 0%;
      border-radius: 7px;
      transition: width 0.35s ease;
    }

    .card-A .vote-fill { background: var(--color-a); }
    .card-B .vote-fill { background: var(--color-b); }
    .card-C .vote-fill { background: var(--color-c); }
    .card-D .vote-fill { background: var(--color-d); }

    .vote-count {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent-brown);
      min-width: 85px;
      text-align: right;
    }

    /* 揭曉按鈕列 */
    .action-panel {
      padding: 24px 40px 36px;
      display: flex;
      justify-content: center;
      border-top: 2px solid var(--border-warm);
      background: #FAF7F2;
    }

    .reveal-btn {
      padding: 16px 44px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, #8C572B 0%, #633B19 100%);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 900;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(100, 60, 25, 0.25);
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .reveal-btn:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg, #A06634 0%, #73451E 100%);
    }

    /* 大師公案揭曉卡片 */
    .master-reveal-card {
      margin: 20px 40px 40px;
      background: #fff;
      border-radius: var(--radius-lg);
      border: 3px solid var(--accent-gold);
      box-shadow: var(--shadow-lg);
      display: none;
      overflow: hidden;
      animation: popIn 0.4s ease forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .master-header {
      background: linear-gradient(135deg, #2D2724 0%, #463B34 100%);
      color: #fff;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .master-name { font-size: 1.65rem; font-weight: 900; color: #fcefd6; }
    .master-origin { font-size: 1.05rem; color: #d4c5b5; }
    .master-badge { background: var(--accent-gold); color: #241d15; font-size: 1rem; font-weight: 900; padding: 6px 18px; border-radius: var(--radius-pill); }

    .master-body {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .m-box {
      background: #FCF9F4;
      border-radius: 16px;
      padding: 22px 26px;
      border: 1.5px solid var(--border-warm);
    }

    .m-box-title { font-size: 1.2rem; font-weight: 900; color: var(--accent-brown); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .m-box-text { font-size: 1.2rem; color: #2b2723; line-height: 1.7; }
    .antidote-box { background: #F0F7F4; border-color: #BAD9CE; }
    .antidote-box .m-box-title { color: #286353; }
    .antidote-box .m-box-text { color: #16473B; font-weight: 700; }

    /* 頁腳版權區 */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border-warm);
      padding: 24px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    footer a { color: var(--accent-brown); text-decoration: underline; font-weight: 700; }
  </style>
</head>

    let currentQIndex = 0;
    let audioCtx = null;

    function playZenChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.8);
        gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.0);
      } catch (e) {}
    }

    function renderTabs() {
      const container = document.getElementById("tabsStrip");
      container.innerHTML = "";
      questionsData.forEach((q, idx) => {
        const tab = document.createElement("div");
        tab.className = `q-tab ${idx === currentQIndex ? 'active' : ''}`;
        tab.onclick = () => switchQuestion(idx);
        tab.innerHTML = `<i class="fa-solid fa-seedling"></i> 情境 ${q.id}：${q.tabName}`;
        container.appendChild(tab);
      });
    }

    function renderQuestion() {
      const q = questionsData[currentQIndex];
      const container = document.getElementById("stageCard");
      const totalVotes = q.options.reduce((sum, opt) => sum + opt.votes, 0);

      container.innerHTML = `
        <div class="scenario-header">
          <h2 class="scenario-title">${q.title}</h2>
          <div class="scenario-desc">${q.desc}</div>
        </div>

        <div class="options-section">
          <div class="options-tip-bar">
            <span class="options-tip"><i class="fa-solid fa-hand-point-up"></i> 請大家舉手投票直覺抉擇（點選 ＋／− 即時計票）：</span>
            <button class="reset-btn" onclick="resetCurrentVotes()"><i class="fa-solid fa-arrows-rotate"></i> 重置本題票數</button>
          </div>

          <div class="quad-grid">
            ${q.options.map((opt, optIdx) => {
              const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
              return `
                <div class="quad-card card-${opt.letter}">
                  <div class="card-top">
                    <div class="card-letter">${opt.letter}</div>
                    <div class="card-text">${opt.text}</div>
                  </div>
                  <div class="card-vote-bar">
                    <div class="vote-btns">
                      <button class="v-btn" onclick="changeVote(${optIdx}, -1)">−</button>
                      <button class="v-btn" onclick="changeVote(${optIdx}, 1)">＋</button>
                    </div>
                    <div class="vote-track">
                      <div class="vote-fill" style="width: ${percent}%;"></div>
                    </div>
                    <div class="vote-count">${opt.votes} 票 (${percent}%)</div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>

        <div class="action-panel">
          <button class="reveal-btn" onclick="revealMasterAnswer()">
            <i class="fa-solid fa-bell"></i> 揭曉禪宗大師神操作
          </button>
        </div>

        <div class="master-reveal-card" id="masterCard">
          <div class="master-header">
            <div>
              <div class="master-name">大師登場：${q.master.name}</div>
              <div class="master-origin">經典出處：${q.master.origin}</div>
            </div>
            <div class="master-badge">對應神操作：選項 ${q.options.find(o => o.isZen).letter}</div>
          </div>
          <div class="master-body">
            <div class="m-box">
              <div class="m-box-title"><i class="fa-solid fa-scroll"></i> 【原汁原味禪門公案】</div>
              <div class="m-box-text">${q.master.story}</div>
            </div>
            <div class="m-box">
              <div class="m-box-title"><i class="fa-solid fa-spa"></i> 【星雲大師法音解析】</div>
              <div class="m-box-text">${q.master.analysis}</div>
            </div>
            <div class="m-box antidote-box">
              <div class="m-box-title"><i class="fa-solid fa-heart-pulse"></i> 【現代人間解藥】</div>
              <div class="m-box-text">${q.master.antidote}</div>
            </div>
          </div>
        </div>
      `;
    }

    function changeVote(optIdx, delta) {
      const q = questionsData[currentQIndex];
      q.options[optIdx].votes = Math.max(0, q.options[optIdx].votes + delta);
      renderQuestion();
    }

    function resetCurrentVotes() {
      const q = questionsData[currentQIndex];
      q.options.forEach(o => o.votes = 0);
      renderQuestion();
    }

    function switchQuestion(idx) {
      currentQIndex = idx;
      renderTabs();
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function revealMasterAnswer() {
      const card = document.getElementById("masterCard");
      const btn = document.querySelector(".reveal-btn");
      if (card) {
        if (card.style.display === "block") {
          card.style.display = "none";
          if (btn) btn.innerHTML = '<i class="fa-solid fa-bell"></i> 揭曉禪宗大師神操作';
        } else {
          playZenChime();
          card.style.display = "block";
          if (btn) btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> 收起大師神操作';
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && currentQIndex < questionsData.length - 1) {
        switchQuestion(currentQIndex + 1);
      } else if (e.key === "ArrowLeft" && currentQIndex > 0) {
        switchQuestion(currentQIndex - 1);
      } else if (e.key === " ") {
        revealMasterAnswer();
      }
    });

    renderTabs();
    renderQuestion();
  </script>
